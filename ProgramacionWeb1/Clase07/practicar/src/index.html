<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulador de Prestamos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Simulador de Prestamos</h1>
        <form action="procesar.php" method="post">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required>

            <label for="monto">Monto solicitado</label>
            <input id="monto" name="monto" type="number" step="0.01" min="1" required>

            <label for="interes">Interes anual (%)</label>
            <input id="interes" name="interes" type="number" step="0.01" min="0" max="100" required>

            <label for="anios">Anios</label>
            <input id="anios" name="anios" type="number" min="1" required>

            <label for="tipo">Tipo de prestamo</label>
            <select id="tipo" name="tipo" required>
                <option value="">Seleccione una opcion</option>
                <option value="personal">Personal</option>
                <option value="vehicular">Vehicular</option>
                <option value="hipotecario">Hipotecario</option>
                <option value="educativo">Educativo</option>
            </select>

            <button type="submit">Calcular prestamo</button>
        </form>
    </main>
</body>
</html>
